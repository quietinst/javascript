<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 01 — Countdown Timer</title>
    <script type="module" crossorigin src="./assets/1-timer-t7ia_x-O.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/styles-w8Ozx9ws.js">
    <link rel="modulepreload" crossorigin href="./assets/iziToast.min-DecOxEyx.js">
    <link rel="stylesheet" crossorigin href="./assets/styles-D0KNDt6a.css">

  </head>
  <body>
    <main class="container">
      <h1>Task 01 — Countdown Timer</h1>
      <a href="./index.html">Back to module</a>

      <div class="timer-widget">
        <input type="text" id="datetime-picker" />
        <button type="button" data-start>Start</button>
        <div class="timer">
          <div class="field">
            <span class="value" data-days>00</span>
            <span class="label">Days</span>
          </div>
          <div class="field">
            <span class="value" data-hours>00</span>
            <span class="label">Hours</span>
          </div>
          <div class="field">
            <span class="value" data-minutes>00</span>
            <span class="label">Minutes</span>
          </div>
          <div class="field">
            <span class="value" data-seconds>00</span>
            <span class="label">Seconds</span>
          </div>
        </div>
      </div>
    </main>

  </body>
</html>
