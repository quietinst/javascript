<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search and browse images via the Pixabay API"
    />
    <title>Module 11 — Image Search</title>
  </head>
  <body>
    <main class="container">
      <form class="form">
        <label>
          <input
            type="text"
            name="search-text"
            placeholder="Search images..."
          />
        </label>
        <button type="submit">Search</button>
      </form>

      <span class="loader is-hidden"></span>

      <ul class="gallery"></ul>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
