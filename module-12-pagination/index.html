<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search and browse images via the Pixabay API"
    />
    <title>Module 12 — Pagination</title>
  </head>
  <body>
    <main class="container">
      <form class="form">
        <label>
          <input type="text" name="search-text" placeholder="Search images..." />
        </label>
        <button type="submit">Search</button>
      </form>

      <ul class="gallery"></ul>

      <button type="button" class="load-more is-hidden">Load more</button>

      <span class="loader is-hidden"></span>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
